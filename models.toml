# Canonical models. A provider file maps these names to its own model ids.
#
#   label       shown in the UI
#   context     published context window, tokens
#   openrouter  OpenRouter slug, used as a price source and to read each provider's quantization
#   aliases     other spellings providers use; `pb provider add` matches /models ids against these
#
# A model that is not listed here can still be run as  provider:<raw model id>.

[models."glm-5.3-flash"]
label = "GLM-5.3 Flash"
context = 1048576
openrouter = "z-ai/glm-5.3-flash"
aliases = ["glm5.3-flash", "glm-5p3-flash", "zai-org/glm-5.3-flash", "zai-org/GLM-5.3-Flash"]

