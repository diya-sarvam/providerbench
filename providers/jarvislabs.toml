name = "JarvisLabs"
base_url = "https://models.jarvislabs.net/v1"
key_env = "JARVISLABS_API_KEY"
docs = "https://jarvislabs.ai/products/token-factory"

[models]
"glm-5.3-flash" = "glm-5.3-flash"
"deepseek-v4.1-flash" = "deepseek-v4.1-flash-1017"
"gemma-4-31b" = "gemma-4-31b-it"
"glm-5.3" = "glm-5.3"

[thinking_off]
"deepseek-v4.1-flash" = { chat_template_kwargs = { thinking = false } }

[extra_body]
"gemma-4-31b" = { chat_template_kwargs = { enable_thinking = true } }

[quirks]
reasoning_field = "reasoning_content"
responses_api = false                  # /v1/responses returns 404

[[pricing]]
source = "scrape"
url = "https://jarvislabs.ai/products/token-factory"
currency = "USD"
# each model card: 'Copy model ID <id>' button, then a <dl> with Input / Cached / Output
pattern = '''aria-label="Copy model ID (?P<model>[^"]+)".{0,8000}?>Input</dt><dd[^>]*>(?P<input>[^<]+)</dd>(?:.{0,400}?>Cached[^<]*</dt><dd[^>]*>(?P<cached_input>[^<]+)</dd>)?.{0,400}?>Output</dt><dd[^>]*>(?P<output>[^<]+)</dd>'''

[[pricing]]
source = "manual"
