name = "Blaze"
base_url = "https://blaze.e2enetworks.net/v1"
key_env = "BLAZE_API_KEY"
docs = "https://blazeinfer.ai/models"

[headers]
x-session-id = "{session}"

[models]
"glm-5.3-flash" = "zai-org/glm-5.3-flash"
"deepseek-v4.1-flash" = "deepseek-ai/deepseek-v4.1-flash"
"gemma-4-31b" = "google/gemma-4-31b-it"
"kimi-k3.1-pro" = "moonshotai/kimi-k3.1-pro"
"kimi-k3" = "moonshotai/kimi-k3"

[thinking_off]
"deepseek-v4.1-flash" = { reasoning_effort = "none" }

[extra_body]
"gemma-4-31b" = { chat_template_kwargs = { enable_thinking = true } }

[[pricing]]
source = "scrape"
url = "https://blazeinfer.ai/models"
currency = "USD"
pattern = '''title="Copy model ID"[^>]*><span[^>]*>(?P<model>[^<]+)</span>.{0,8000}?>Input</dt><dd[^>]*>(?P<input>[^<]+)</dd>(?:.{0,400}?>Cached input</dt><dd[^>]*>(?P<cached_input>[^<]+)</dd>)?.{0,400}?>Output</dt><dd[^>]*>(?P<output>[^<]+)</dd>'''

[[pricing]]
source = "manual"
